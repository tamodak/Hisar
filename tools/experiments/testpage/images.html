<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hisar picture cases</title>
<style>
  body { font: 14px sans-serif; margin: 8px; }
  .grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .cell { width: 150px; }
  .cell img, .card img, .bg { width: 150px; height: 112px; object-fit: cover; display: block; background: #fff; }
  .bg { background-size: cover; background-position: center; }
  .card { display: block; width: 150px; color: inherit; text-decoration: none; }
  .card span { display: block; font-size: 12px; }
  #hisar-test-results { white-space: pre-wrap; font-family: monospace; }
</style>
</head>
<body>
<!--
  Cases for the picture filter (tools/experiments, site "images"). Every case says what should
  happen; the script at the end checks what is drawn (a covered picture is a uniform grey
  placeholder or its outline mask) and which video cards are left, and writes the verdict into
  #hisar-test-results, which the harness reads.
  Pictures: images/manifest.json (Open Images, CC BY 2.0; see images/SOURCES.md).
-->
<h3>Pictures</h3>
<div class="grid" id="pictures"></div>
<h3>Video cards</h3>
<div class="grid" id="videos"></div>
<h3>Inline (data:) and backgrounds</h3>
<div class="grid" id="inline"></div>
<pre id="hisar-test-results">running…</pre>
<script>
(async function () {
  const manifest = await (await fetch('images/manifest.json')).json();
  const $ = (id) => document.getElementById(id);
  manifest.pictures.forEach((p, i) => {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML = '<img data-expect="' + p.expect + '" data-case="picture ' + p.file + '" src="images/' + p.file + '?p' + i + '">';
    $('pictures').appendChild(cell);
  });
  manifest.videos.forEach((p, i) => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = '/watch?v=case' + i;
    a.dataset.expect = p.expect === 'cover' ? 'gone' : 'stay';
    a.dataset.case = 'video ' + p.file;
    a.innerHTML = '<img src="images/' + p.file + '?v' + i + '"><span>Video ' + i + '</span><span>12:3' + (i % 10) + '</span>';
    $('videos').appendChild(a);
  });
  // A picture the page holds itself, and one set as a background, and one in <picture>.
  for (const [i, p] of manifest.inline.entries()) {
    // Carried inside the manifest (JSON), so it reaches the page without a picture request.
    const data = 'data:image/jpeg;base64,' + p.data;
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.innerHTML = '<img data-expect="' + p.expect + '" data-case="inline ' + p.file + '" src="' + data + '">';
    $('inline').appendChild(cell);
    const bg = document.createElement('div');
    bg.className = 'cell';
    bg.innerHTML = '<div class="bg" data-expect="' + p.expect + '" data-case="background ' + p.file + '" style="background-image:url(images/' + p.file + '?bg' + i + ')"></div>';
    $('inline').appendChild(bg);
    const pic = document.createElement('div');
    pic.className = 'cell';
    pic.innerHTML = '<picture><source srcset="images/' + p.file + '?src' + i + '"><img data-expect="' + p.expect + '" data-case="picture-element ' + p.file + '" src="images/' + p.file + '?fallback' + i + '"></picture>';
    $('inline').appendChild(pic);
  }
  setTimeout(check, manifest.waitMillis || 15000);

  function grey(ctx, w, h) {
    const d = ctx.getImageData(0, 0, w, h).data;
    let same = 0;
    for (let i = 0; i < d.length; i += 4) if (Math.abs(d[i] - 0xe8) < 4 && Math.abs(d[i + 1] - 0xea) < 4 && Math.abs(d[i + 2] - 0xed) < 4) same++;
    return same / (d.length / 4);
  }
  async function drawn(el) {
    // What the engine decoded for the element: its image, redrawn small.
    let src = el.tagName === 'IMG' ? el.currentSrc || el.src : (getComputedStyle(el).backgroundImage.match(/url\("?(.*?)"?\)/) || [])[1];
    if (!src) return { state: 'none' };
    const img = new Image();
    img.src = src;
    try { await img.decode(); } catch (e) { return { state: 'broken' }; }
    const c = document.createElement('canvas');
    c.width = 64; c.height = 48;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, 64, 48);
    const g = grey(ctx, 64, 48);
    const black = (() => { const d = ctx.getImageData(0, 0, 64, 48).data; let n = 0; for (let i = 0; i < d.length; i += 4) if (d[i] < 8 && d[i + 1] < 8 && d[i + 2] < 8) n++; return n / (d.length / 4); })();
    return { state: g > 0.98 ? 'grey' : src.startsWith('data:image/jpeg') && black > 0.02 ? 'outlined' : 'shown', grey: g, black: black };
  }
  async function check() {
    const lines = [];
    let pass = 0, fail = 0;
    for (const el of document.querySelectorAll('[data-expect]')) {
      let ok, got;
      if (el.classList.contains('card')) {
        got = el.offsetParent === null || getComputedStyle(el).display === 'none' ? 'gone' : 'stay';
        ok = got === el.dataset.expect;
      } else {
        const d = await drawn(el);
        got = d.state;
        ok = el.dataset.expect === 'cover' ? got === 'grey' || got === 'outlined' : got === 'shown';
      }
      if (ok) pass++; else fail++;
      lines.push((ok ? 'ok   ' : 'FAIL ') + el.dataset.case + ': expected ' + el.dataset.expect + ', got ' + got);
    }
    document.getElementById('hisar-test-results').textContent = pass + ' passed, ' + fail + ' failed\n' + lines.join('\n');
  }
})();
</script>
</body>
</html>
